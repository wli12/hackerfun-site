<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackerFun</title>
<meta name="description" content="B站上有深度的 UP主：近三年的百大，加上一份从 V2EX、知乎、豆瓣等社区的公开推荐里挑出来的精选名单。每位都标了深度星级，每天更新。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HackerFun">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fb7299'/%3E%3Ctext x='16' y='23.5' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='22' fill='white'%3EH%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff; --bg2: #f2f2f2; --bg3: #e5e5e5; --text: #0f0f0f; --muted: #606060;
    --accent: #fb7299; --link: #065fd4; --hover: rgba(0,0,0,.05);
    --chip-on: #0f0f0f; --chip-on-text: #ffffff; --t1: #0a8043; --t2: #b06000; --t3: #606060;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f0f; --bg2: #272727; --bg3: #3f3f3f; --text: #f1f1f1; --muted: #aaaaaa;
      --link: #3ea6ff; --hover: rgba(255,255,255,.08);
      --chip-on: #f1f1f1; --chip-on-text: #0f0f0f; --t1: #4cc38a; --t2: #f0b354; --t3: #aaaaaa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f0f; --bg2: #272727; --bg3: #3f3f3f; --text: #f1f1f1; --muted: #aaaaaa;
    --link: #3ea6ff; --hover: rgba(255,255,255,.08);
    --chip-on: #f1f1f1; --chip-on-text: #0f0f0f; --t1: #4cc38a; --t2: #f0b354; --t3: #aaaaaa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", -apple-system, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
  h1, h2, h3, h4, p { margin: 0; }

  /* top bar */
  .top { position: fixed; inset: 0 0 auto 0; height: 56px; z-index: 10; background: var(--bg);
         display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 16px; }
  .left, .right { display: flex; align-items: center; flex: none; }
  .left { gap: 12px; }
  .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .icon:hover { background: var(--hover); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.8px; white-space: nowrap; }
  .brand b { color: var(--accent); }
  .search { flex: 0 1 640px; display: flex; min-width: 0; }
  .search input { flex: 1; min-width: 0; height: 40px; padding: 0 16px; font: inherit; font-size: 16px; color: var(--text);
                  background: var(--bg); border: 1px solid var(--bg3); border-right: 0; border-radius: 40px 0 0 40px; outline: none; }
  .search input:focus { border-color: var(--link); }
  .search button { width: 64px; height: 40px; border: 1px solid var(--bg3); background: var(--bg2);
                   border-radius: 0 40px 40px 0; display: grid; place-items: center; }

  /* sidebar */
  .side { position: fixed; top: 56px; bottom: 0; left: 0; width: 240px; overflow-y: auto; padding: 12px; background: var(--bg); z-index: 9; }
  .side a { display: flex; align-items: center; gap: 24px; height: 40px; padding: 0 12px; border-radius: 10px; }
  .side a:hover { background: var(--hover); }
  .side a.on { background: var(--bg2); font-weight: 500; }
  .side hr { border: 0; border-top: 1px solid var(--bg3); margin: 12px 0; }
  .side h4 { padding: 6px 12px; font-size: 16px; font-weight: 500; }
  .side .area { gap: 8px; justify-content: space-between; }
  .side .area span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .foot { padding: 12px; color: var(--muted); font-size: 12px; line-height: 18px; }
  .count { color: var(--muted); font-size: 12px; font-weight: 400; }
  body.collapsed .side { width: 72px; padding: 4px; }
  body.collapsed .side a { flex-direction: column; gap: 4px; height: 74px; justify-content: center; font-size: 10px; padding: 0; }
  body.collapsed .side .areas-nav { display: none; }
  .scrim { display: none; }
  main { margin-left: 240px; padding: 56px 24px 48px; min-height: 100vh; }
  body.collapsed main { margin-left: 72px; }
  /* watch page: no sidebar, like YouTube and Bilibili; the menu button slides it in over the page */
  body.watching main, body.watching.collapsed main { margin-left: 0; }
  body.watching .side, body.watching.collapsed .side { transform: translateX(-100%); transition: transform .2s; width: 240px; padding: 12px; }
  body.watching.drawer .side { transform: none; box-shadow: 0 0 24px rgba(0,0,0,.3); }
  body.watching.collapsed .side a { flex-direction: row; height: 40px; font-size: 14px; padding: 0 12px; justify-content: flex-start; gap: 24px; }
  body.watching.collapsed .side .areas-nav { display: block; }
  body.watching.drawer .scrim { display: block; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.4); z-index: 8; }

  /* chips, pills, filter bar */
  .chip { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--bg2); font-weight: 500;
          white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { background: var(--bg3); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .chip .ava { width: 20px; height: 20px; font-size: 10px; margin-left: -4px; }
  .pill { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--bg2); font-weight: 500;
          display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pill:hover, .pill.on { background: var(--bg3); }
  .pill.pri { background: var(--text); color: var(--bg); }
  .pill svg { width: 20px; height: 20px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 16px; }
  .filterbar .chip span { font-size: 16px; line-height: 1; opacity: .7; }
  .filterbar .grow { flex: 1; }
  /* filters: a row of dropdowns; each button shows what is picked in it */
  .filterbar { position: relative; }          /* the open dropdown hangs below the whole row, so it never covers the other buttons */
  .ddwrap { display: inline-flex; }
  .pill.dd svg { width: 18px; height: 18px; margin: 0 -6px 0 -2px; opacity: .7; fill: currentColor; transition: transform .15s; }
  .pill.dd.open svg { transform: rotate(180deg); }
  .pill.dd.on { background: var(--chip-on); color: var(--chip-on-text); }
  .box { width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 4px; flex: none; display: inline-grid; place-items: center;
         font-size: 12px; font-weight: 700; line-height: 1; }
  .box.on { background: var(--text); border-color: var(--text); color: var(--bg); }
  .box.on::after { content: "✓"; }
  .box.part::after { content: "–"; }
  .box.radio { border-radius: 50%; }
  .box.radio.on { background: var(--text); box-shadow: inset 0 0 0 3px var(--bg); }
  .box.radio.on::after { content: ""; }
  .ddmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; min-width: 220px; width: max-content; max-width: min(340px, calc(100vw - 16px));
            max-height: min(62vh, 560px); overflow-y: auto; padding: 6px; background: var(--bg); border: 1px solid var(--bg3); border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .2); font-weight: 400; }
  .ddmenu .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; text-align: left; white-space: nowrap; }
  .ddmenu .opt:hover { background: var(--bg2); }
  .ddmenu .opt.on { font-weight: 500; }
  .ddmenu .optrow { display: flex; align-items: center; }
  .ddmenu .optrow .opt { flex: 1; width: auto; }
  .ddmenu .exp { width: 36px; height: 36px; flex: none; border-radius: 8px; color: var(--muted); font-size: 20px; transition: transform .15s; }
  .ddmenu .exp:hover { background: var(--bg2); }
  .ddmenu .exp.open { transform: rotate(90deg); }
  .ddmenu .subopts { margin: 0 0 4px 18px; padding-left: 8px; border-left: 2px solid var(--bg3); }
  .ddmenu hr { border: 0; border-top: 1px solid var(--bg3); margin: 6px 4px; }
  .catwrap { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .d1 { background: var(--t1); } .d2 { background: var(--t2); } .d3 { background: var(--t3); }

  /* video grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px 16px; padding-top: 16px; }
  .vcard { display: block; min-width: 0; }
  .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg2); }
  .thumb img { position: relative; width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 12px; color: #fff; font-weight: 700; font-size: 15px; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500;
         padding: 1px 4px; border-radius: 4px; }
  .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.45); }   /* how much has been watched */
  .prog i { display: block; height: 100%; background: var(--accent); }
  .done-tag { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 500; padding: 1px 6px; border-radius: 4px; }
  /* the menu a long press on a video opens, and the note with "undo" that follows */
  .cmenu-back { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .25); }
  .cmenu { position: fixed; min-width: 240px; max-width: min(340px, calc(100vw - 24px)); padding: 6px; background: var(--bg); border: 1px solid var(--bg3);
           border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .3); }
  .cmenu .cm-title { padding: 8px 10px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmenu button { display: block; width: 100%; padding: 12px 10px; border-radius: 8px; text-align: left; font-size: 15px; }
  .cmenu button:hover { background: var(--bg2); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 16px; max-width: calc(100vw - 24px);
           padding: 12px 16px; border-radius: 10px; background: var(--chip-on); color: var(--chip-on-text); box-shadow: 0 6px 20px rgba(0, 0, 0, .3); }
  .toast button { color: inherit; font-weight: 700; text-decoration: underline; white-space: nowrap; }
  @media (pointer: coarse) {   /* so that a long press reaches the page instead of the browser's link preview or text selection */
    [data-live] a, .secondary a.next { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  }
  .later-btn { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 4px; background: rgba(0,0,0,.8);
               color: #fff; display: none; place-items: center; cursor: pointer; }
  .later-btn svg { width: 20px; height: 20px; }
  a:hover .later-btn, .later-btn.on { display: grid; }
  .info { display: flex; gap: 12px; padding-top: 12px; }
  .ava { flex: none; border-radius: 50%; overflow: hidden; background: var(--bg3); display: grid; place-items: center;
         color: #fff; font-weight: 700; width: 36px; height: 36px; font-size: 15px; }
  .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vt { margin: 0 0 4px; font-size: 16px; font-weight: 500; line-height: 22px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 14px; line-height: 20px; }
  .sub a:hover { color: var(--text); }
  .status { color: var(--muted); padding: 48px 0; text-align: center; }

  /* page heads */
  .pagehead h2 { font-size: 24px; margin: 16px 0 0; }
  .pagehead .sub { margin-top: 4px; }
  .crumb { display: inline-block; margin-top: 16px; color: var(--muted); }
  .crumb:hover { color: var(--text); }
  .crumb + h2 { margin-top: 2px; }
  .sechead { font-size: 20px; font-weight: 700; margin: 28px 0 2px; display: flex; align-items: center; gap: 8px; }
  .sechead + .sub { margin-bottom: 14px; }
  .sechead .chip { font-size: 14px; }

  /* categories page */
  .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
  .areacard { background: var(--bg2); border-radius: 12px; padding: 14px 16px; }
  .areaname { display: flex; align-items: center; font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  .areaname .count, .cats .count { margin-left: auto; padding-left: 8px; }
  .cats a { display: flex; align-items: center; padding: 6px 0; color: var(--muted); flex: 1; min-width: 0; }
  .cats a:hover, .areaname a:hover { color: var(--text); text-decoration: underline; }
  .cats .count { margin-left: 8px; padding-left: 0; }
  .catrow { display: flex; align-items: center; gap: 12px; }
  .catrow.off a { opacity: .45; text-decoration: line-through; }
  .areaname { gap: 8px; } .areaname .count { margin-left: 0; padding-left: 0; font-weight: 400; }
  .areaname .chip { margin-left: auto; height: 26px; font-size: 12px; background: var(--bg3); }

  /* list rows */
  .results { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; max-width: 1100px; }
  .srow { display: flex; gap: 16px; }
  .srow .thumb { width: 360px; flex: none; }
  .srow .vt { font-size: 18px; line-height: 26px; font-weight: 400; }
  .srow .chan { display: flex; align-items: center; gap: 8px; margin: 12px 0; color: var(--muted); }
  .srow .chan .ava { width: 24px; height: 24px; font-size: 11px; }
  .snip { color: var(--muted); font-size: 12px; line-height: 18px; }

  /* creators */
  .ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px 16px; padding-top: 4px; }
  .urow { display: flex; gap: 16px; padding: 12px; border-radius: 12px; align-items: flex-start; min-width: 0; }
  .urow:hover { background: var(--hover); }
  .urow.off { opacity: .5; }
  .urow .ava { width: 64px; height: 64px; font-size: 24px; }
  .urow b { font-size: 16px; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urow .why { color: var(--muted); font-size: 13px; line-height: 18px; margin-top: 4px;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tier { font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tier.t1 { color: var(--t1); } .tier.t2 { color: var(--t2); } .tier.t3 { color: var(--t3); }
  .stars { letter-spacing: 1px; font-size: 12px; }
  .stars.t1 { color: var(--t1); } .stars.t2 { color: var(--t2); } .stars.t3 { color: var(--t3); }
  .chip.on .stars { color: inherit; }
  .chead { display: flex; gap: 24px; align-items: center; padding: 24px 0 8px; flex-wrap: wrap; }
  .chead .ava { width: 120px; height: 120px; font-size: 44px; }
  .chead h2 { font-size: 32px; line-height: 40px; }
  .chead .why { margin: 8px 0 12px; max-width: 720px; line-height: 22px; }

  /* subscriptions */
  .subs { max-width: 900px; }
  .addbox { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .addbox input { flex: 1 1 260px; min-width: 0; height: 36px; padding: 0 14px; font: inherit; color: var(--text); background: var(--bg);
                  border: 1px solid var(--bg3); border-radius: 18px; outline: none; }
  .addbox input:focus { border-color: var(--link); }
  .srowu { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 12px; }
  .srowu.off .ava, .srowu.off .grow { opacity: .45; }
  .srowu .switch { margin-top: 10px; }
  .setting { display: flex; align-items: flex-start; gap: 16px; max-width: 720px; margin-top: 20px; padding: 16px; border: 1px solid var(--bg3); border-radius: 12px; }
  .setting > div { flex: 1; min-width: 0; }
  .setting p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
  .setting .switch { margin-top: 2px; }
  .srowu .sub { display: block; }
  .two { display: block; font-size: 13px; line-height: 19px; margin-top: 2px; }
  .two.why { color: var(--muted); margin-top: 0; }
  .srowu:hover { background: var(--hover); }
  .srowu .ava { width: 40px; height: 40px; }
  .srowu .grow { flex: 1; min-width: 0; }
  .srowu b { font-weight: 500; font-size: 15px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .switch { position: relative; flex: none; width: 36px; height: 20px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch .knob { position: absolute; inset: 0; border-radius: 10px; background: var(--bg3); transition: background .15s; }
  .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                         background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + .knob { background: var(--link); }
  .switch input:checked + .knob::after { transform: translateX(16px); }
  .switch input:focus-visible + .knob { outline: 2px solid var(--link); outline-offset: 2px; }

  /* watch page */
  .watch { display: flex; gap: 24px; padding-top: 24px; max-width: 1754px; margin: 0 auto; }
  .primary { flex: 1; min-width: 0; }
  .secondary { width: 402px; flex: none; }
  .player { aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .poster { position: relative; width: 100%; height: 100%; display: block; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px;
                  border-radius: 14px; background: rgba(0,0,0,.7); display: grid; place-items: center; transition: background .15s; }
  .poster:hover .play { background: var(--accent); }
  .poster .play svg { width: 32px; height: 32px; color: #fff; }
  .watch h1 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 12px 0 8px; }
  .owner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .owner .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .owner .who .ava { width: 40px; height: 40px; }
  .owner .who b { font-size: 16px; font-weight: 500; display: block; }
  .desc { background: var(--bg2); border-radius: 12px; padding: 12px; margin-top: 12px; line-height: 20px; }
  .desc .top-line { font-weight: 500; margin-bottom: 6px; }
  .desc p { margin: 0 0 10px; }
  .desc .why { color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--bg3); font-weight: 500; }
  .secondary h3 { font-size: 16px; margin: 0 0 12px; }
  .next { display: flex; gap: 8px; margin-bottom: 8px; }
  .next .thumb { width: 168px; flex: none; border-radius: 8px; }
  .next .vt { font-size: 14px; line-height: 20px; }
  .next .sub { font-size: 12px; line-height: 18px; }

  .about { max-width: 720px; margin: 0 auto; padding: 24px 0 48px; font-size: 15px; line-height: 1.7; }
  .about h1 { font-size: 32px; letter-spacing: -.5px; margin: 8px 0; }
  .about .lede { font-size: 18px; color: var(--muted); margin-bottom: 24px; }
  .about h2 { font-size: 20px; margin: 32px 0 8px; }
  .about p, .about ul { margin: 0 0 12px; }
  .about a { color: var(--link); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--bg2); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; letter-spacing: -.5px; }
  .stat span { color: var(--muted); font-size: 13px; }

  @media (max-width: 1100px) { .watch { flex-direction: column; } .secondary { width: 100%; } }
  @media (max-width: 800px) {
    main, body.collapsed main { margin-left: 0; padding: 56px 16px 32px; }
    .side, body.collapsed .side { transform: translateX(-100%); transition: transform .2s; width: 240px; padding: 12px; }
    body.drawer .side { transform: none; box-shadow: 0 0 24px rgba(0,0,0,.3); }

    if (l.classList.contains("pill")) l.innerHTML = `${on ? CHECK : CLOCK}<span>${on ? "已加入稍后再看" : "稍后再看"}</span>`;
    else { l.classList.toggle("on", on); l.innerHTML = on ? CHECK : CLOCK; }
    return; }
  const pl = e.target.closest("[data-play]");
  if (pl) { const bv = pl.dataset.play, av = aid(bv), cid = (shown.get(bv) || {}).cid;
    // the same address Bilibili's own "embed code" button produces, plus autoplay and danmaku.
    // On a phone that address redirects to www.bilibili.com, so the permissions are granted to any origin ("*"):
    // by default they only reach the origin in src, and the fullscreen button then does nothing.
    $("#player").innerHTML = `<iframe src="https://player.bilibili.com/player.html?isOutside=true${av ? "&aid=" + av : ""}&bvid=${encodeURIComponent(bv)}${cid ? "&cid=" + cid : ""}&p=1&autoplay=1&danmaku=1"
      scrolling="no" allow="autoplay *; fullscreen *; picture-in-picture *" allowfullscreen title="Bilibili 播放器"></iframe>`;
    startWatch(shown.get(bv)); return; }
  const dn = e.target.closest("[data-done]");
  if (dn) { const v = shown.get(dn.dataset.done); if (!v) return;
    const done = !isDone(v); setProg(v.bv, done ? v.d : 0);
    if (watching && watching.bv === v.bv) Object.assign(watching, { base: done ? v.d : 0, acc: 0, from: document.hidden ? 0 : Date.now() });   // counting starts again from here
    dn.outerHTML = doneBtn(v); return; }
  // filter dropdowns
  if (openMenu && !e.target.closest(".ddwrap")) { openMenu = ""; const m = $("#ddmenu"); if (m) m.remove();   // a click elsewhere closes the dropdown, then does its own job
    document.querySelectorAll(".pill.dd.open").forEach((b) => { b.classList.remove("open"); b.setAttribute("aria-expanded", "false"); }); }
  const mb = e.target.closest("[data-menu]");
  if (mb) { openMenu = openMenu === mb.dataset.menu ? "" : mb.dataset.menu; menuScroll = 0;
    if (openMenu === "cat") AREAS.forEach((a) => { if (a.subs.some((x) => multi("cat").includes(x.id))) catExp.add(a.id); });   // show what is ticked
    rerender(); return; }
  const inMenu = e.target.closest("#ddmenu");
  if (inMenu) menuScroll = inMenu.scrollTop;
  const ex = e.target.closest("[data-exp]");
  if (ex) { catExp.has(ex.dataset.exp) ? catExp.delete(ex.dataset.exp) : catExp.add(ex.dataset.exp); rerender(); return; }
  const ma = e.target.closest("#ddmenu a");
  if (ma) { if (ma.dataset.area) catExp.add(ma.dataset.area);            // ticking an area unfolds its sub-categories
    if (!("keep" in ma.dataset)) { openMenu = ""; if (ma.getAttribute("href") === (location.hash || "#/")) rerender(); }   // one choice only: close
    return; }
  if (e.target.closest("[data-hidedone]")) { hideDone = !hideDone; store.set("hf_hidedone", hideDone); rerender(); return; }
  if (e.target.closest("[data-own]")) { ownOnly = !ownOnly; store.set("hf_own", ownOnly); rerender(); return; }
  const t = e.target.closest("[data-tier]");
  if (t) { const n = +t.dataset.tier, next = tiers.includes(n) ? tiers.filter((x) => x !== n) : tiers.concat(n);
    if (next.length) { tiers = next; store.set("hf_tiers", tiers); rerender(); }   // at least one level stays on
    return; }
  const s = e.target.closest("[data-usort]");
  if (s) { store.set("hf_usort", s.dataset.usort); rerender(); return; }
  const sb = e.target.closest("[data-subbtn]");
  if (sb) { const id = sb.dataset.subbtn; off = off.includes(id) ? off.filter((x) => x !== id) : off.concat(id); store.set("hf_off", off); rerender(); return; }
  const b = e.target.closest("[data-bulk]");
  if (b) { const g = b.dataset.bulk, ids = UPS.filter((u) => g === "k" ? u.k : g === "x" ? u.x : !u.k && !u.x && u.t === +g).map((u) => u.id);
    off = off.filter((x) => !ids.includes(x)).concat(b.dataset.to === "off" ? ids : []); store.set("hf_off", off); rerender(); return; }
  const tps = e.target.closest("[data-topics]");
  if (tps) { const ids = areaById.get(tps.dataset.topics).subs.map((x) => x.id);
    topicsOff = topicsOff.filter((x) => !ids.includes(x)).concat(tps.dataset.to === "off" ? ids : []); store.set("hf_topics", topicsOff); rerender(); return; }
  const jmp = e.target.closest("[data-jump]");
  if (jmp) { const el = document.getElementById(jmp.dataset.jump); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 72, behavior: "smooth" }); return; }
  const c = e.target.closest("[data-clear]");
  if (c) { if (c.dataset.clear === "later") { later = []; store.set("hf_later2", later); } else { seen = []; store.set("hf_seen2", seen); } rerender(); }
});
document.addEventListener("change", (e) => {
  const tp = e.target.closest("[data-topic]");
  if (tp) { const id = tp.dataset.topic; topicsOff = tp.checked ? topicsOff.filter((x) => x !== id) : topicsOff.filter((x) => x !== id).concat(id);
    store.set("hf_topics", topicsOff); rerender(); return; }
  const s = e.target.closest("[data-sub]"); if (!s) return;
  const id = s.dataset.sub; off = s.checked ? off.filter((x) => x !== id) : off.filter((x) => x !== id).concat(id);
  store.set("hf_off", off); rerender();
});
$("#search").addEventListener("submit", (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (q) location.hash = "#/search/" + encodeURIComponent(q); });
document.addEventListener("keydown", (e) => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); } });
if (store.get("hf_collapsed", false)) document.body.classList.add("collapsed");
$("#menu").onclick = () => { if (innerWidth <= 800 || document.body.classList.contains("watching")) document.body.classList.toggle("drawer");
  else store.set("hf_collapsed", document.body.classList.toggle("collapsed")); };
$("#scrim").onclick = () => document.body.classList.remove("drawer");
const th = store.get("hf_theme", null); if (th) document.documentElement.dataset.theme = th;
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const n = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n; store.set("hf_theme", n); };
lastPath = location.hash.split("?")[0];
boot().catch(() => { view.innerHTML = `<div class="status">数据加载失败，请刷新重试。</div>`; });
})();
</script>
