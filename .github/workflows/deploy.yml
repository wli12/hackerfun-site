# This file is copied into the public site repository as .github/workflows/deploy.yml on every publish.
# It deploys the pushed files to GitHub Pages itself, which lifts the limit of about 10 builds an hour that
# "Deploy from a branch" has, and tries again by itself when a deployment fails.
# It only acts once the repository's Pages source is set to "GitHub Actions"; until then it does nothing
# and GitHub's own branch build keeps deploying as before.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer publish replaces one that is still waiting

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - name: Which way is Pages set to deploy
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)"
          echo "Pages source: $type"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" = "legacy" ]; then echo "::notice::Pages still deploys from the branch; this workflow does nothing until the source is set to GitHub Actions."; fi
      - uses: actions/checkout@v4
        if: steps.mode.outputs.type != 'legacy'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.type != 'legacy'
        with:
          path: .
      # The first try can come too soon after the upload ("No artifacts named github-pages were found"), and GitHub
      # sometimes answers a deployment with a server error for a while: five tries, about 18 minutes in all
      - id: try1
        if: steps.mode.outputs.type != 'legacy'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try1.outcome == 'failure'
        run: sleep 20
      - id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try2.outcome == 'failure'
        run: sleep 120
      - id: try3
        if: steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try3.outcome == 'failure'
        run: sleep 300
      - id: try4
        if: steps.try3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.try4.outcome == 'failure'
        run: sleep 600
      - id: try5
        if: steps.try4.outcome == 'failure'
        uses: actions/deploy-pages@v4
